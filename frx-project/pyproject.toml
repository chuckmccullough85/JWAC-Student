[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "jwac-frx-case-study"
version = "0.1.0"
description = "Local defensive-training case study for JWAC threat modeling and secure code review"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
  "Flask==3.1.2",
  "cryptography==46.0.5",
]

[project.optional-dependencies]
dev = [
  "pytest==9.0.2",
]

[project.scripts]
frx-portal = "frx_portal.cli:main"
frx-fixture = "frx_portal.fixture_service:main"
frx-reset = "frx_portal.database:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
frx_portal = ["templates/*.html", "static/*.css", "static/*.js"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
